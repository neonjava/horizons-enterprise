          <path d="m319 214 7 6-7 6" fill="none" stroke="#69c9ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M584 220 H620" stroke="#69c9ed" stroke-width="2" stroke-dasharray="5 5" class="flow"/>
          <path d="m613 214 7 6-7 6" fill="none" stroke="#69c9ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M878 220 H914" stroke="#69c9ed" stroke-width="2" stroke-dasharray="5 5" class="flow"/>
          <path d="m907 214 7 6-7 6" fill="none" stroke="#69c9ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
